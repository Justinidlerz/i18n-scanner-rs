name: CI
env:
  DEBUG: napi:*
  APP_NAME: i18n-scanner-rs
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '0'
'on':
  push:
    branches:
      - main
    tags-ignore:
      - '**'
    paths-ignore:
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**
  pull_request: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        name: Install pnpm
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Oxlint
        run: pnpm lint
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: pnpm build --target x86_64-apple-darwin
          - host: windows-latest
            build: pnpm build --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm build --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm build --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: pnpm build --target aarch64-unknown-linux-gnu --use-napi-cross
    name: stable - ${{ matrix.settings.target }} - node@22
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        name: Install pnpm
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}-
      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            ${{ env.APP_NAME }}.*.node
            ${{ env.APP_NAME }}.*.wasm
          if-no-files-found: error
  test-macOS-windows-binding:
    name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
          - host: macos-latest
            target: x86_64-apple-darwin
            architecture: x64
        node:
          - '20'
          - '22'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        name: Install pnpm
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.settings.architecture }}
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: npm test
  test-linux-binding:
    name: Test ${{ matrix.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
        node:
          - '20'
          - '22'
    runs-on: ${{ contains(matrix.target, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        name: Install pnpm
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Output docker params
        id: docker
        run: |
          node -e "
            if ('${{ matrix.target }}'.startsWith('aarch64')) {
              console.log('PLATFORM=linux/arm64')
            } else if ('${{ matrix.target }}'.startsWith('armv7')) {
              console.log('PLATFORM=linux/arm/v7')
            } else {
              console.log('PLATFORM=linux/amd64')
            }
          " >> $GITHUB_OUTPUT
          node -e "
            if ('${{ matrix.target }}'.endsWith('-musl')) {
              console.log('IMAGE=node:${{ matrix.node }}-alpine')
            } else {
              console.log('IMAGE=node:${{ matrix.node }}-slim')
            }
          " >> $GITHUB_OUTPUT
      - name: Install dependencies
        run: |
          pnpm config set --json supportedArchitectures '{"cpu":["current","arm64","x64","arm"],"libc":["current","musl","gnu"]}'
          pnpm install --no-frozen-lockfile
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: bindings-${{ matrix.target }}
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: ${{ contains(matrix.target, 'armv7') }}
        with:
          platforms: all
      - run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
        if: ${{ contains(matrix.target, 'armv7') }}
      - name: Test bindings
        shell: bash
        run: |
          # Run docker directly to avoid client API mismatches from third-party wrapper actions.
          docker run --rm \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            --platform "${{ steps.docker.outputs.PLATFORM }}" \
            "${{ steps.docker.outputs.IMAGE }}" \
            npm test
  publish:
    name: Publish
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    needs:
      - lint
      - test-macOS-windows-binding
      - test-linux-binding
    steps:
      - uses: actions/checkout@v5
        with:
          # Changesets needs the commits that introduced each changeset when generating changelogs.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        name: Install pnpm
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install npm 12
        run: |
          npm install -g npm@12
          npm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: create npm dirs
        run: pnpm napi create-npm-dirs
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Move artifacts
        run: pnpm artifacts
      - name: List packages
        run: find ./npm -maxdepth 2 -type f -print
        shell: bash
      - name: Detect changesets
        id: changesets
        shell: bash
        run: |
          # README documents the workflow and must not trigger a release by itself.
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit | grep -q .; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare beta versions
        if: github.event_name == 'pull_request' && steps.changesets.outputs.found == 'true'
        run: |
          npm config set provenance true
          # Snapshot versions include a timestamp, so every update to the PR can be published safely.
          pnpm changeset version --snapshot beta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish beta
        id: beta
        if: github.event_name == 'pull_request' && steps.changesets.outputs.found == 'true'
        uses: changesets/action@v1
        with:
          publish: pnpm release --tag beta
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published beta packages
        id: verify-beta
        if: github.event_name == 'pull_request' && steps.beta.outputs.published == 'true'
        timeout-minutes: 5
        uses: actions/github-script@v9
        env:
          PUBLISHED_PACKAGES: ${{ steps.beta.outputs.publishedPackages }}
        with:
          script: |
            const packages = JSON.parse(process.env.PUBLISHED_PACKAGES);
            if (packages.length === 0) return;

            // N-API publishes platform packages inside prepublishOnly, outside Changesets' package list.
            const { readFileSync, readdirSync } = require('node:fs');
            const { execFileSync } = require('node:child_process');
            const { setTimeout: delay } = require('node:timers/promises');
            const rootPackage = JSON.parse(readFileSync('package.json', 'utf8'));
            for (const directory of readdirSync('npm', { withFileTypes: true })) {
              if (!directory.isDirectory()) continue;
              const candidate = JSON.parse(readFileSync(`npm/${directory.name}/package.json`, 'utf8'));
              if (!candidate.private && rootPackage.optionalDependencies?.[candidate.name] === candidate.version) {
                packages.push({ name: candidate.name, version: candidate.version });
              }
            }
            const publishedPackages = [...new Map(packages.map(pkg => [`${pkg.name}@${pkg.version}`, pkg])).values()];
            const registryArgs = rootPackage.publishConfig?.registry
              ? ['--registry', rootPackage.publishConfig.registry]
              : [];
            const retryableCodes = new Set([
              'E404', 'ETARGET', 'E408', 'E429', 'E500', 'E502', 'E503', 'E504',
              'ECONNRESET', 'ETIMEDOUT', 'ESOCKETTIMEDOUT', 'EAI_AGAIN',
            ]);
            const maxAttempts = 6;
            for (const { name, version } of publishedPackages) {
              for (let attempt = 1; ; attempt++) {
                try {
                  const result = JSON.parse(execFileSync('npm', [
                    'view', `${name}@${version}`, 'version', '--json',
                    '--prefer-online', '--fetch-retries=0', ...registryArgs,
                  ], {
                    encoding: 'utf8',
                    timeout: 15000,
                    stdio: ['ignore', 'pipe', 'pipe'],
                  }));
                  // npm 12 wraps scalar JSON results in an array; older npm returns a string.
                  const versions = Array.isArray(result) ? result : [result];
                  if (versions.length !== 1 || versions[0] !== version) {
                    throw new Error(`Unexpected registry version for ${name}@${version}: ${JSON.stringify(result)}`);
                  }
                  core.info(`Verified ${name}@${version}`);
                  break;
                } catch (error) {
                  let code = error.code;
                  try {
                    code = JSON.parse(error.stdout?.toString() || '{}').error?.code || code;
                  } catch {
                    // Preserve the process error when npm did not return JSON diagnostics.
                  }
                  if (!retryableCodes.has(code) || attempt === maxAttempts) {
                    throw new Error(`Cannot verify ${name}@${version} after ${attempt} attempt(s): ${error.message}`, { cause: error });
                  }
                  const waitMs = Math.min(2000 * 2 ** (attempt - 1), 15000);
                  core.warning(`Registry lookup for ${name}@${version} failed (${code}); retrying in ${waitMs}ms (${attempt}/${maxAttempts}).`);
                  await delay(waitMs);
                }
              }
            }
            core.setOutput('packages', JSON.stringify(publishedPackages));
      - name: Comment beta versions on PR
        if: github.event_name == 'pull_request' && steps.verify-beta.outputs.packages != ''
        uses: actions/github-script@v9
        env:
          VERIFIED_PACKAGES: ${{ steps.verify-beta.outputs.packages }}
        with:
          retries: 3
          script: |
            const publishedPackages = JSON.parse(process.env.VERIFIED_PACKAGES);
            const issue_number = context.payload.pull_request.number;
            const head = context.payload.pull_request.head.sha;
            const { data: pullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: issue_number,
            });
            // A superseded run must not replace the latest commit's release comment.
            if (pullRequest.head.sha !== head) {
              core.info('Skipping beta comment because the PR head has changed.');
              return;
            }

            const marker = '<!-- changesets-beta-release -->';
            const repositoryUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const body = [
              marker,
              '### Beta packages published',
              '',
              `Commit: [\`${head.slice(0, 7)}\`](${repositoryUrl}/commit/${head})`,
              `[Workflow run](${repositoryUrl}/actions/runs/${context.runId})`,
              '',
              '| Package | Beta version |',
              '| --- | --- |',
              ...publishedPackages.map(({ name, version }) =>
                `| [\`${name}\`](https://www.npmjs.com/package/${name}/v/${version}) | \`${version}\` |`
              ),
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
      - name: Consume changesets and publish stable package
        if: github.event_name == 'push' && steps.changesets.outputs.found == 'true'
        run: |
          npm config set provenance true
          pnpm changeset version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .changeset CHANGELOG.md package.json pnpm-lock.yaml
          git commit -m 'chore: release package [skip ci]'
          pnpm release
          git push --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
